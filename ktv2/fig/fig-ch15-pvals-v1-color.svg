<text x="150" y="1082" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">0번 대 기대 165번으로 표준편차의 1.9배 떨어졌다(이항 양쪽 p = 0.065). 가운데 비</text>
