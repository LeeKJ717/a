<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1556" viewBox="0 0 1300 1556">
<rect x="0" y="0" width="1300" height="1210" fill="#FFFFFF" stroke="none" stroke-width="1.0" />
<rect x="80" y="60" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="104" r="24" fill="#9C4F2E" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="115" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">1</text>
<text x="172" y="108" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">원문을 고정한다</text>
<text x="172" y="148" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">파일의 SHA-256 해시를 적는다. 점검은 이 파일에 대해</text>
<text x="172" y="186" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">서만 한다.</text>
<rect x="960" y="102" width="260" height="68" fill="#9C4F2E" stroke="#9C4F2E" stroke-width="2.4" />
<text x="1090" y="146" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">직접 실행 확인</text>
<rect x="80" y="264" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="308" r="24" fill="#8A6A2C" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="319" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">2</text>
<text x="172" y="312" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">모델을 부른다</text>
<text x="172" y="352" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">온도 0, 시드 고정, 원문 전체를 넣고 한 줄에 주장 하나</text>
<text x="172" y="390" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">로 쓰게 한다. 인용은 따옴표, 계산값은 [계산].</text>
<rect x="960" y="306" width="260" height="68" fill="#8A6A2C" stroke="#8A6A2C" stroke-width="2.4" />
<text x="1090" y="350" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">z840 실행 필요</text>
<rect x="80" y="468" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="512" r="24" fill="#8A6A2C" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="523" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">3</text>
<text x="172" y="516" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">모델 출력을 받는다</text>
<text x="172" y="556" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">이 책은 받지 못했다. 대신 모델이 틀리게 쓴 값을 일부</text>
<text x="172" y="594" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">러 섞은 시연값으로 3단계를 대신했다.</text>
<rect x="960" y="510" width="260" height="68" fill="#8A6A2C" stroke="#8A6A2C" stroke-width="2.4" />
<text x="1090" y="554" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">시연값</text>
<rect x="80" y="672" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="716" r="24" fill="#9C4F2E" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="727" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">4</text>
<text x="172" y="720" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">글자 점검: 인용, 숫자, 단위</text>
<text x="172" y="760" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">인용이 원문에 글자 그대로 있는가, 숫자가 원문에 있는</text>
<text x="172" y="798" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">가, 단위가 같은가.</text>
<rect x="960" y="714" width="260" height="68" fill="#9C4F2E" stroke="#9C4F2E" stroke-width="2.4" />
<text x="1090" y="758" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">직접 실행 확인</text>
<rect x="80" y="876" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="920" r="24" fill="#9C4F2E" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="931" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">5</text>
<text x="172" y="924" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">계산 점검: 식, 백분율, 표, 범위</text>
<text x="172" y="964" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">산술식, 백분율과 표본 수, 표의 행 합과 열 합, 확률과 </text>
<text x="172" y="1002" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">연대의 범위.</text>
<rect x="960" y="918" width="260" height="68" fill="#9C4F2E" stroke="#9C4F2E" stroke-width="2.4" />
<text x="1090" y="962" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">직접 실행 확인</text>
<rect x="80" y="1080" width="840" height="152" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="1124" r="24" fill="#9C4F2E" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="1135" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">6</text>
<text x="172" y="1128" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">같은 입력으로 두 번 돌려 견준다</text>
<text x="172" y="1168" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">숫자가 달라지는 줄은 모델이 흔들린 곳이다. 시연 출력</text>
<text x="172" y="1206" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">두 개로 실행했다.</text>
<rect x="960" y="1122" width="260" height="68" fill="#9C4F2E" stroke="#9C4F2E" stroke-width="2.4" />
<text x="1090" y="1166" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">직접 실행 확인</text>
<rect x="80" y="1284" width="840" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="2.4" />
<circle cx="124" cy="1328" r="24" fill="#3A7CA5" stroke="#FFFFFF" stroke-width="2.0"/>
<text x="124" y="1339" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">7</text>
<text x="172" y="1332" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">사람이 원문 쪽을 본다</text>
<text x="172" y="1372" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">뜻의 오류(항목을 바꿔 붙임, 부정문 뒤집기)는 점검기</text>
<text x="172" y="1410" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">가 보지 못한다. 지적된 줄과 통과한 줄 모두 표본으로 </text>
<text x="172" y="1448" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">본다.</text>
<rect x="960" y="1345" width="260" height="68" fill="#FFFFFF" stroke="#3A7CA5" stroke-width="2.4" />
<text x="1090" y="1389" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#3A7CA5">사람</text>
<line x1="500" y1="212" x2="500" y2="258" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,244 512,244 500,260" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<line x1="500" y1="416" x2="500" y2="462" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,448 512,448 500,464" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<line x1="500" y1="620" x2="500" y2="666" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,652 512,652 500,668" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<line x1="500" y1="824" x2="500" y2="870" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,856 512,856 500,872" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<line x1="500" y1="1028" x2="500" y2="1074" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,1060 512,1060 500,1076" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<line x1="500" y1="1232" x2="500" y2="1278" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="488,1264 512,1264 500,1280" fill="#6B7A82" stroke="#6B7A82" stroke-width="1.0" stroke-linejoin="round"/>
<rect x="80" y="1506" width="14" height="14" fill="#9C4F2E" stroke="#9C4F2E" stroke-width="1.0" />
<text x="110" y="1520" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">이 컨테이너에서 실행해 로그를 남김</text>
<rect x="600" y="1506" width="14" height="14" fill="#8A6A2C" stroke="#8A6A2C" stroke-width="1.0" />
<text x="630" y="1520" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">실행하지 못함 또는 시연값</text>
</svg>
