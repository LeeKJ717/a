<text x="487.5" y="210" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#555555">소문자, 접두어 없음</text>
<text x="487.5" y="248" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#555555">같은 DOI는 한 줄</text>
