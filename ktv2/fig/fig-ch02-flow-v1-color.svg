<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="1000" viewBox="0 0 1300 1000">
<rect x="0" y="0" width="1300" height="1000" fill="#FFFFFF" stroke="none" stroke-width="1.0" />
<rect x="55" y="120" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" stroke-dasharray="14 8"/>
<text x="182.5" y="164" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">1 검색</text>
<text x="182.5" y="210" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">API로 DOI와</text>
<text x="182.5" y="248" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">서지 목록을 받음</text>
<rect x="360" y="120" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="487.5" y="164" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">2 DOI 정규화</text>
<text x="487.5" y="210" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">소문자, 접두어 없음</text>
<text x="487.5" y="248" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">같은 DOI는 한 줄</text>
<line x1="314" y1="215" x2="356" y2="215" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="356,215 335.7,223.6 335.7,206.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="665" y="120" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" stroke-dasharray="14 8"/>
<text x="792.5" y="164" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">3 메타데이터</text>
<text x="792.5" y="210" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">제목, 연도, 초록</text>
<text x="792.5" y="248" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">상태 abstract</text>
<line x1="619" y1="215" x2="661" y2="215" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="661,215 640.7,223.6 640.7,206.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="970" y="120" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="1097.5" y="164" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">4 OA 판 찾기</text>
<text x="1097.5" y="210" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">PDF 주소를 고름</text>
<text x="1097.5" y="248" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">랜딩 페이지는 제외</text>
<line x1="924" y1="215" x2="966" y2="215" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="966,215 945.7,223.6 945.7,206.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="55" y="430" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" stroke-dasharray="14 8"/>
<text x="182.5" y="474" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">5 PDF 받기</text>
<text x="182.5" y="520" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">요청 간격, 429 처리</text>
<text x="182.5" y="558" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">%PDF- 확인, 해시</text>
<rect x="360" y="430" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="487.5" y="474" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">6 글과 표 추출</text>
<text x="487.5" y="520" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">PDF에서 글자, 표</text>
<text x="487.5" y="558" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">상태 pdf</text>
<line x1="314" y1="525" x2="356" y2="525" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="356,525 335.7,533.6 335.7,516.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="665" y="430" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="792.5" y="474" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">7 점검</text>
<text x="792.5" y="520" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">행 합, 열 합,</text>
<text x="792.5" y="558" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">값 범위, 비율</text>
<line x1="619" y1="525" x2="661" y2="525" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="661,525 640.7,533.6 640.7,516.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="970" y="430" width="255" height="190" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="1097.5" y="474" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">DB에 적재</text>
<text x="1097.5" y="520" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">SQLite works,</text>
<text x="1097.5" y="558" font-size="29" font-weight="400" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">sources, refs</text>
<line x1="924" y1="525" x2="966" y2="525" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="966,525 945.7,533.6 945.7,516.4" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<line x1="1097.5" y1="310" x2="1097.5" y2="350" stroke="#6B7A82" stroke-width="3.0"/>
<line x1="1097.5" y1="350" x2="182.5" y2="350" stroke="#6B7A82" stroke-width="3.0"/>
<line x1="182.5" y1="350" x2="182.5" y2="426" stroke="#6B7A82" stroke-width="3.0"/>
<polygon points="182.5,426 173.9,405.7 191.1,405.7" fill="#6B7A82" stroke="none" stroke-width="0" stroke-linejoin="round"/>
<rect x="55" y="674" width="70" height="36" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" />
<text x="140" y="700" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">이 컨테이너에서 실행해 확인(실선)</text>
<rect x="55" y="736" width="70" height="36" fill="#FFFFFF" stroke="#6B7A82" stroke-width="3.0" stroke-dasharray="14 8"/>
<text x="140" y="762" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">실제 서버에 접속하지 못함: 가짜 서버로만 실행(z840 확인 필요, 점선)</text>
<text x="55" y="870" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">상태(status)는 올라가기만 한다</text>
<rect x="55" y="892" width="340" height="44" fill="#8A6A2C" stroke="#6B7A82" stroke-width="2.0" />
<text x="225" y="924" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">cited 서지만 앎</text>
<rect x="455" y="892" width="340" height="44" fill="#3A7CA5" stroke="#6B7A82" stroke-width="2.0" />
<text x="625" y="924" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">abstract 초록까지</text>
<rect x="855" y="892" width="340" height="44" fill="#9C4F2E" stroke="#6B7A82" stroke-width="2.0" />
<text x="1025" y="924" font-size="29" font-weight="700" text-anchor="middle" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#FFFFFF">pdf 전문 확보</text>
</svg>
