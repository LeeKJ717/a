<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760">
<rect x="0" y="0" width="1300" height="760" fill="#FFFFFF" stroke="none" stroke-width="1.0" />
<text x="60" y="60" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">미지 층의 파편을 기준 집단 A, B, C에 배정한 결과 (파편 수)</text>
<text x="60" y="164" font-size="29" font-weight="700" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#1B2A33">X층</text>
<text x="60" y="204" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">원천 A 24개</text>
