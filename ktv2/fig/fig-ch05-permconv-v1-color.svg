<text x="150" y="906" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">표 [[16,2],[4,10]]의 이름표를 섞어 구한 p = (b+1)/(B+1). B가 1000 이하이면 가능한 </text>
<text x="150" y="944" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">가장 작은 p(1/(B+1))가 정확한 값보다 크다. 되풀이는 B 10만까지 20번, 100만은 5번.</text>
<text x="150" y="982" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">값은 permutation-basic.json(실습 5-2).</text>
