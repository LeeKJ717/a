<text x="150" y="1038" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">는 이 장에서 새로 시험한 규칙으로 30개 모두 표와 0.1 이내이며(최대 0.095), 논문이</text>
<text x="150" y="1076" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">이 규칙을 썼다는 근거는 아니다. 규칙 E의 점은 가로 위치가 표 값 그대로이고 세로가</text>
<text x="150" y="1114" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#5F7F93">규칙 E의 값이다. 입력은 제1권 표 10.</text>
