<text x="60" y="992" font-size="29" font-weight="400" text-anchor="start" font-family="'Noto Sans CJK KR','Malgun Gothic',sans-serif" fill="#555555">실습 4-12. 점선은 한 번의 실측 시간에 B를 곱한 것이고(위쪽 눈금 10^4 s에서 끊었다), 실선</text>
